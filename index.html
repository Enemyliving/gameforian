<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Road Rush</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #1a1a2e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    touch-action: none;
  }
  #game { display: block; margin: 0 auto; background: #2d2d44; }
  #ui {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; color: white;
  }
  #hud {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 24px; font-size: 20px; font-weight: 700;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }
  #hud span.icon { margin-right: 6px; }
  #overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.75); color: white; text-align: center;
    pointer-events: all;
  }
  #overlay h1 { font-size: 40px; margin: 0 0 8px; }
  #overlay p { font-size: 16px; opacity: 0.8; margin: 4px 0 20px; max-width: 320px; }
  #overlay button {
    font-size: 18px; font-weight: 700; padding: 14px 36px; border-radius: 30px;
    border: none; background: linear-gradient(135deg,#ff5e62,#ff9966); color: white;
    cursor: pointer; box-shadow: 0 4px 12px rgba(255,94,98,0.4);
  }
  #overlay button:active { transform: scale(0.96); }
  #score-final { font-size: 22px; margin-bottom: 4px; font-weight: 700; }
  #best { font-size: 14px; opacity: 0.7; margin-bottom: 20px; }
  #controls-hint {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    font-size: 13px; opacity: 0.6; text-align: center;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="ui">
  <div id="hud">
    <div><span class="icon">🪙</span><span id="coins">0</span></div>
    <div><span class="icon">⭐</span><span id="score">0</span></div>
  </div>
  <div id="controls-hint">← → смена полосы · ↑ прыжок · ↓ подкат<br>(или свайпы на телефоне)</div>
</div>
<div id="overlay">
  <img id="menuFace" style="width:96px;height:96px;border-radius:50%;object-fit:cover;margin-bottom:12px;border:3px solid #ff9966;" alt="">
  <h1>Road Rush</h1>
  <p>Катись на скейте по шоссе! Свайпай/жми стрелки, чтобы менять полосы, перепрыгивать поваленные брёвна и подныривать под ветки — и вовремя объезжай машины поперёк дороги.</p>
  <button id="startBtn">Начать забег</button>
</div>

for (const key in FACE_SRC) {
  const img = new Image();
  img.src = FACE_SRC[key];
  FACE_IMAGES[key] = img;
}

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const coinsEl = document.getElementById('coins');

  let W, H;
  function resize(){
    W = canvas.width = Math.min(window.innerWidth, 480);
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // ---- Game constants ----
  const LANE_COUNT = 3;
  const GROUND_Y_RATIO = 0.78;
  const PLAYER_W = 40, PLAYER_H = 60;
  const GRAVITY = 0.0028;
  const JUMP_VELOCITY = -0.95;
  const BASE_SPEED = 0.32;   // world units per ms
  const SPEED_RAMP = 0.000006;

  let laneX = [];
  function computeLanes(){
    const laneWidth = W / LANE_COUNT;
    laneX = [];
    for (let i=0;i<LANE_COUNT;i++) laneX.push(laneWidth*i + laneWidth/2);
  }
  computeLanes();

  let state = 'menu'; // menu, playing, dead
  let best = parseInt(localStorage.getItem('metro_best')||'0', 10);

  let player, obstacles, coins, particles, worldSpeed, distance, coinCount, lastTime, spawnTimer, coinSpawnTimer;

  function resetGame(){
    computeLanes();
    player = {
      lane: 1,
      x: laneX[1],
      targetX: laneX[1],
      y: 0,           // 0 = ground, negative = height above ground
      vy: 0,
      state: 'run',   // run, jump, slide
      slideTimer: 0,
      runFrame: 0,
      dead: false
    };
    obstacles = [];
    coins = [];
    particles = [];
    worldSpeed = BASE_SPEED;
    distance = 0;
    coinCount = 0;
    spawnTimer = 0;
    coinSpawnTimer = 0;
    lastTime = null;
  }

  // ---- Input ----
  function changeLane(dir){
    if (player.dead) return;
    const nl = player.lane + dir;
    if (nl < 0 || nl >= LANE_COUNT) return;
    player.lane = nl;
    player.targetX = laneX[nl];
  }
  function doJump(){
    if (player.dead) return;
    if (player.state === 'run'){
      player.state = 'jump';
      player.vy = JUMP_VELOCITY;
    }
  }
  function doSlide(){
    if (player.dead) return;
    if (player.state === 'run'){
      player.state = 'slide';
      player.slideTimer = 550;
    }
  }

  window.addEventListener('keydown', (e)=>{
    if (state !== 'playing') return;
    switch(e.key){
      case 'ArrowLeft': case 'a': changeLane(-1); break;
      case 'ArrowRight': case 'd': changeLane(1); break;
      case 'ArrowUp': case 'w': case ' ': doJump(); break;
      case 'ArrowDown': case 's': doSlide(); break;
    }
  });

  // touch swipe
  let touchStartX=0, touchStartY=0, touchActive=false;
  canvas.addEventListener('touchstart', (e)=>{
    if (state!=='playing') return;
    touchActive = true;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  });
  canvas.addEventListener('touchend', (e)=>{
    if (!touchActive || state!=='playing') return;
    touchActive = false;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy)){
      if (Math.abs(dx) > 30) changeLane(dx>0?1:-1);
    } else {
      if (dy < -30) doJump();
      else if (dy > 30) doSlide();
    }
  });

  // ---- Obstacle / coin spawning ----
  const OB_TYPES = ['log','branch','car'];
  function spawnObstacle(){
    const type = OB_TYPES[Math.floor(Math.random()*OB_TYPES.length)];
    const lane = Math.floor(Math.random()*LANE_COUNT);
    // avoid impossible walls: don't block all 3 lanes with same type at same z
    obstacles.push({ lane, type, z: 1600 });
  }
  function spawnCoinRow(){
    const lane = Math.floor(Math.random()*LANE_COUNT);
    const arc = Math.random() < 0.4;
    const count = 5 + Math.floor(Math.random()*4);
    for (let i=0;i<count;i++){
      coins.push({
        lane, z: 1700 + i*40,
        yOff: arc ? -Math.sin(i/(count-1)*Math.PI)*120 : 0,
        collected: false
      });
    }
  }

  function spawnParticle(x,y,color){
    particles.push({x,y,vx:(Math.random()-0.5)*0.3,vy:-Math.random()*0.3,life:500,maxLife:500,color});
  }

  // ---- Update ----
  function update(dt){
    distance += worldSpeed*dt;
    worldSpeed = BASE_SPEED + distance*SPEED_RAMP;

    // lane interpolation
    player.x += (player.targetX - player.x) * Math.min(1, dt*0.02);

    // vertical physics
    if (player.state === 'jump'){
      player.vy += GRAVITY*dt;
      player.y += player.vy*dt;
      if (player.y >= 0){ player.y = 0; player.vy=0; player.state='run'; }
    }
    if (player.state === 'slide'){
      player.slideTimer -= dt;
      if (player.slideTimer <= 0) player.state = 'run';
    }
    player.runFrame += dt*0.012;

    // spawn timers
    spawnTimer -= dt;
    if (spawnTimer <= 0){
      spawnObstacle();
      spawnTimer = Math.max(650, 1100 - distance*0.02);
    }
    coinSpawnTimer -= dt;
    if (coinSpawnTimer <= 0){
      spawnCoinRow();
      coinSpawnTimer = 1500 + Math.random()*1200;
    }

    // move obstacles / coins
    for (const ob of obstacles) ob.z -= worldSpeed*dt;
    for (const c of coins) c.z -= worldSpeed*dt;
    obstacles = obstacles.filter(o=>o.z > -100);
    coins = coins.filter(c=>c.z > -100);

    // collisions: obstacles reach player at z ~ 0
    for (const ob of obstacles){
      if (ob.hit) continue;
      if (ob.z < 60 && ob.z > -40 && ob.lane === player.lane){
        let collide = false;
        if (ob.type === 'log'){
          // fallen log/traffic cone — must ollie over it
          if (player.state !== 'jump' || player.y > -30) collide = true;
        } else if (ob.type === 'branch'){
          // low tree branch overhanging the road — must duck/slide under
          if (player.state !== 'slide') collide = true;
        } else if (ob.type === 'car'){
          collide = true; // parked sideways across the whole lane — always deadly, must change lane
        }
        if (collide){
          ob.hit = true;
          killPlayer();
        }
      }
    }

    // coin collection
    for (const c of coins){
      if (c.collected) continue;
      if (c.z < 60 && c.z > -40 && c.lane === player.lane){
        const coinHeight = c.yOff;
        const playerHeight = player.y;
        if (Math.abs(coinHeight - playerHeight) < 60){
          c.collected = true;
          coinCount++;
          coinsEl.textContent = coinCount;
        }
      }
    }

    // particles
    for (const p of particles){
      p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
    }
    particles = particles.filter(p=>p.life>0);

    scoreEl.textContent = Math.floor(distance/10);
  }

  function killPlayer(){
    if (player.dead) return;
    player.dead = true;
    for (let i=0;i<14;i++) spawnParticle(player.x, groundY()+player.y, '#ff5e62');
    state = 'dead';
    setTimeout(showGameOver, 500);
  }

  function groundY(){ return H*GROUND_Y_RATIO; }

  // ---- Draw ----
  function drawBackground(){
    const gy = groundY();
    // sky
    const skyGrad = ctx.createLinearGradient(0,0,0,gy);
    skyGrad.addColorStop(0, '#7ec8e3');
    skyGrad.addColorStop(1, '#cdeaf0');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0,0,W,gy);

    // distant hills
    ctx.fillStyle = '#8fc17a';
    ctx.beginPath();
    ctx.moveTo(0, gy-70);
    for (let i=0;i<=6;i++){
      const hx = i*(W/6);
      const hy = gy-70-Math.sin(i*1.3+ distance*0.0006)*22-18;
      ctx.lineTo(hx, hy);
    }
    ctx.lineTo(W, gy); ctx.lineTo(0, gy);
    ctx.fill();

    // roadside grass shoulders
    ctx.fillStyle = '#5b9e4d';
    ctx.fillRect(0, gy-40, W, H-gy+40);

    // scrolling roadside trees (parallax scenery, purely decorative)
    ctx.fillStyle = '#3f7a37';
    const treeSpacing = 130;
    const treeOff = (distance*0.9) % treeSpacing;
    for (let i=-1;i<3;i++){
      const tx = i*treeSpacing - treeOff;
      const leftX = 14 + (tx % (W*2));
      const ty = gy - 46;
      ctx.beginPath();
      ctx.arc(12, ty, 16, 0, Math.PI*2);
      ctx.arc(W-12, ty - ((i%2)*10), 16, 0, Math.PI*2);
      ctx.fill();
    }

    // road (asphalt)
    ctx.fillStyle = '#4a4a52';
    ctx.fillRect(0, gy, W, H-gy);

    // road edge lines (solid, near shoulders)
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 3;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(4, gy); ctx.lineTo(4, H);
    ctx.moveTo(W-4, gy); ctx.lineTo(W-4, H);
    ctx.stroke();

    // lane dividers (dashed, scrolling)
    ctx.strokeStyle = 'rgba(255,220,90,0.85)';
    ctx.lineWidth = 3;
    ctx.setLineDash([26,22]);
    const off = (distance*0.9) % 48;
    ctx.lineDashOffset = -off;
    for (let i=1;i<LANE_COUNT;i++){
      const x = W/LANE_COUNT*i;
      ctx.beginPath();
      ctx.moveTo(x, gy);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    ctx.lineDashOffset = 0;
    ctx.setLineDash([]);
  }

  function laneScreenX(lane, z){
    // simple perspective: interpolate between center-vanishing point and lane x
    const vp = W/2;
    const t = Math.min(1, z/1800);
    const targetX = laneX[lane];
    return vp + (targetX - vp)*(1-t*0.6);
  }
  function zScale(z){
    return Math.max(0.25, 1 - z/1900);
  }
  function zScreenY(z){
    const gy = groundY();
    const t = Math.min(1, z/1800);
    return gy - t*(gy*0.55);
  }

  function drawPlayer(){
    const gy = groundY();
    const s = 1;
    const x = player.x;
    let y = gy + player.y;
    let w = PLAYER_W, h = PLAYER_H;
    if (player.state === 'slide'){ h = PLAYER_H*0.55; y = gy - h + 6; }
    else { y = gy + player.y - h; }

    ctx.save();
    ctx.translate(x, y+h);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(0, 4, w*0.5*(1-Math.min(0.5,-player.y/300)), 8, 0,0,Math.PI*2);
    ctx.fill();

    // body
    const bob = player.state==='run' ? Math.sin(player.runFrame)*4 : 0;
    ctx.translate(0, -h/2 + bob);
    ctx.fillStyle = '#ff9966';
    roundRect(-w/2, -h/2, w, h, 10);
    ctx.fill();
    // head — real photo, clipped to a circle, chosen by game state
    const headR = 17;
    const headCX = 0, headCY = -h/2-10;
    let faceKey = 'neutral';
    if (state === 'menu') faceKey = 'happy';
    else if (state === 'playing') faceKey = 'playing';
    else if (state === 'dead') faceKey = 'neutral';
    const faceImg = FACE_IMAGES[faceKey];

    ctx.save();
    ctx.beginPath();
    ctx.arc(headCX, headCY, headR, 0, Math.PI*2);
    ctx.clip();
    if (state === 'dead') {
      // no sad photo available — simulate defeat with a color effect, not a fabricated expression
      ctx.filter = 'grayscale(70%) brightness(0.75) saturate(0.6)';
    }
    if (faceImg && faceImg.complete && faceImg.naturalWidth > 0){
      ctx.drawImage(faceImg, headCX-headR, headCY-headR, headR*2, headR*2);
    } else {
      ctx.fillStyle = '#ffe0b2';
      ctx.fillRect(headCX-headR, headCY-headR, headR*2, headR*2);
    }
    ctx.filter = 'none';
    ctx.restore();

    if (state === 'dead'){
      ctx.strokeStyle = 'rgba(80,110,160,0.9)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(headCX, headCY, headR, 0, Math.PI*2);
      ctx.stroke();
    }
    // skate stance legs + board (parkour on a skateboard, not running)
    const boardW = w*1.2, boardH = 6;
    let boardY = h/2 + 14, boardTilt = 0;
    if (player.state === 'run'){
      boardY = h/2 + 14 + Math.sin(player.runFrame)*1.2;
    } else if (player.state === 'jump'){
      boardY = h/2 + 9;
      boardTilt = -0.36; // ollie: nose kicks up with the rider
    } else if (player.state === 'slide'){
      boardY = h/2 + 6;
    }

    ctx.strokeStyle = '#333333';
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    if (player.state === 'jump'){
      // knees tucked toward the chest mid-ollie
      ctx.beginPath();
      ctx.moveTo(-8, h/2-6); ctx.lineTo(-10, h/2+3);
      ctx.moveTo(8, h/2-6); ctx.lineTo(10, h/2+3);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(-9, h/2-4); ctx.lineTo(-11, boardY-2);
      ctx.moveTo(9, h/2-4); ctx.lineTo(11, boardY-2);
      ctx.stroke();
    }

    ctx.save();
    ctx.translate(0, boardY);
    ctx.rotate(boardTilt);
    ctx.fillStyle = '#2b2b2b';
    roundRect(-boardW/2, -boardH/2, boardW, boardH, 3);
    ctx.fill();
    ctx.fillStyle = '#e94f37';
    roundRect(-boardW/2+3, -boardH/2-2, boardW-6, 3, 2);
    ctx.fill();
    ctx.fillStyle = '#f2f2f2';
    const wheelR = 4.5;
    ctx.beginPath(); ctx.arc(-boardW*0.32, boardH/2+wheelR-1, wheelR, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(boardW*0.32, boardH/2+wheelR-1, wheelR, 0, Math.PI*2); ctx.fill();
    if (player.state === 'run'){
      ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1;
      [-boardW*0.32, boardW*0.32].forEach(wx=>{
        ctx.beginPath(); ctx.moveTo(wx-3, boardH/2+wheelR-1); ctx.lineTo(wx+3, boardH/2+wheelR-1); ctx.stroke();
      });
    }
    ctx.restore();

    ctx.restore();
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawObstacle(ob){
    const sx = laneScreenX(ob.lane, ob.z);
    const sy = zScreenY(ob.z);
    const sc = zScale(ob.z);
    const gy = groundY();
    ctx.save();
    ctx.translate(sx, gy - (gy-sy));
    if (ob.type === 'log'){
      // fallen log lying across the lane — jump over it
      const w = 84*sc, h = 30*sc;
      ctx.fillStyle = '#8b5a2b';
      roundRect(-w/2, -h, w, h, h*0.45);
      ctx.fill();
      ctx.strokeStyle = '#5c3a1a'; ctx.lineWidth = 2.5*sc; ctx.stroke();
      // cut-end wood rings
      ctx.fillStyle = '#c98f52';
      ctx.beginPath(); ctx.ellipse(-w/2+7*sc, -h/2, 5*sc, h*0.42, 0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(w/2-7*sc, -h/2, 5*sc, h*0.42, 0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#5c3a1a'; ctx.lineWidth = 1.5*sc;
      ctx.beginPath(); ctx.ellipse(-w/2+7*sc, -h/2, 5*sc, h*0.42, 0,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(w/2-7*sc, -h/2, 5*sc, h*0.42, 0,0,Math.PI*2); ctx.stroke();
      // small broken branch stub
      ctx.strokeStyle = '#5c3a1a'; ctx.lineWidth = 3*sc; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-w*0.08,-h*0.2); ctx.lineTo(-w*0.02,-h*0.7); ctx.stroke();
    } else if (ob.type === 'branch'){
      // low-hanging tree branch — duck/slide under it
      const w = 78*sc, barH = 16*sc, gap = 40*sc;
      ctx.strokeStyle = 'rgba(60,40,20,0.5)'; ctx.lineWidth = 2*sc;
      ctx.beginPath(); ctx.moveTo(-w/2+8*sc, -gap-barH); ctx.lineTo(-w/2+8*sc, -gap-barH-16*sc); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(w/2-8*sc, -gap-barH); ctx.lineTo(w/2-8*sc, -gap-barH-16*sc); ctx.stroke();
      ctx.fillStyle = '#6b4423';
      roundRect(-w/2, -gap-barH, w, barH, 5*sc);
      ctx.fill();
      ctx.fillStyle = '#4c8c3f';
      [-w*0.38, 0, w*0.36].forEach((lx)=>{
        ctx.beginPath(); ctx.arc(lx, -gap-barH-8*sc, 13*sc, 0, Math.PI*2); ctx.fill();
      });
      ctx.fillStyle = '#68b357';
      [-w*0.38, 0, w*0.36].forEach((lx)=>{
        ctx.beginPath(); ctx.arc(lx-3*sc, -gap-barH-11*sc, 6*sc, 0, Math.PI*2); ctx.fill();
      });
    } else if (ob.type === 'car'){
      // car parked sideways across the whole lane — must swerve to a different lane
      const w = 112*sc, h = 54*sc;
      const baseY = -h*0.15;
      ctx.fillStyle = '#d8443a';
      roundRect(-w/2, baseY-h*0.5, w, h*0.5, 9*sc);
      ctx.fill();
      // cabin/roof hump
      ctx.beginPath();
      ctx.moveTo(-w*0.26, baseY-h*0.5);
      ctx.quadraticCurveTo(-w*0.2, baseY-h*0.92, -w*0.02, baseY-h*0.92);
      ctx.lineTo(w*0.2, baseY-h*0.92);
      ctx.quadraticCurveTo(w*0.32, baseY-h*0.92, w*0.34, baseY-h*0.5);
      ctx.closePath();
      ctx.fill();
      // windows
      ctx.fillStyle = '#2a3f52';
      ctx.beginPath();
      ctx.moveTo(-w*0.2, baseY-h*0.5);
      ctx.lineTo(-w*0.13, baseY-h*0.82);
      ctx.lineTo(w*0.08, baseY-h*0.82);
      ctx.lineTo(w*0.12, baseY-h*0.5);
      ctx.closePath();
      ctx.fill();
      // wheels
      ctx.fillStyle = '#1c1c1c';
      ctx.beginPath(); ctx.arc(-w*0.28, baseY, 11*sc, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(w*0.28, baseY, 11*sc, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#9a9a9a';
      ctx.beginPath(); ctx.arc(-w*0.28, baseY, 4*sc, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(w*0.28, baseY, 4*sc, 0, Math.PI*2); ctx.fill();
      // headlight + bumper accent
      ctx.fillStyle = '#ffe9a8';
      ctx.beginPath(); ctx.arc(w*0.46, baseY-h*0.32, 5*sc, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(-w/2, baseY-4*sc, w, 4*sc);
    }
    ctx.restore();
  }

  function drawCoin(c){
    if (c.collected) return;
    const sx = laneScreenX(c.lane, c.z);
    const sy = zScreenY(c.z);
    const sc = zScale(c.z);
    const gy = groundY();
    const y = gy - (gy-sy) - 30*sc + c.yOff*sc;
    ctx.save();
    ctx.translate(sx, y);
    ctx.fillStyle = '#ffd54f';
    ctx.beginPath();
    ctx.ellipse(0,0, 12*sc, 12*sc, 0,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#c98a00';
    ctx.lineWidth = 2*sc;
    ctx.stroke();
    ctx.restore();
  }

  function drawParticles(){
    for (const p of particles){
      ctx.globalAlpha = Math.max(0, p.life/p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function render(){
    drawBackground();
    // draw far-to-near: obstacles/coins sorted by z desc, then player
    const drawables = [];
    for (const o of obstacles) drawables.push({z:o.z, draw:()=>drawObstacle(o)});
    for (const c of coins) drawables.push({z:c.z, draw:()=>drawCoin(c)});
    drawables.sort((a,b)=>b.z-a.z);
    for (const d of drawables) d.draw();
    drawPlayer();
    drawParticles();
  }

  // ---- Main loop ----
  function loop(ts){
    if (lastTime === null) lastTime = ts;
    const dt = Math.min(50, ts - lastTime);
    lastTime = ts;
    if (state === 'playing' || state === 'dead'){
      if (state === 'playing') update(dt);
      render();
    }
    requestAnimationFrame(loop);
  }

  function showGameOver(){
    overlay.classList.remove('hidden');
    const finalScore = Math.floor(distance/10);
    if (finalScore > best){ best = finalScore; localStorage.setItem('metro_best', best); }
    overlay.innerHTML = `
      <img id="deadFace" style="width:96px;height:96px;border-radius:50%;object-fit:cover;margin-bottom:12px;border:3px solid #6a89b3;filter:grayscale(70%) brightness(0.8) saturate(0.6);" alt="">
      <h1>Игра окончена</h1>
      <div id="score-final">Очки: ${finalScore} · Монеты: ${coinCount}</div>
      <div id="best">Рекорд: ${best}</div>
      <button id="restartBtn">Играть снова</button>
    `;
    document.getElementById('deadFace').src = FACE_SRC.neutral;
    document.getElementById('restartBtn').addEventListener('click', startGame);
  }

  function startGame(){
    resetGame();
    state = 'playing';
    overlay.classList.add('hidden');
  }

  startBtn.addEventListener('click', startGame);

  document.getElementById('menuFace').src = FACE_SRC.happy;

  resetGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
